services:
  db:
    image: postgres:15-alpine
    container_name: mlflow_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRESQL_MLFLOW_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRESQL_MLFLOW_PASSWORD}
      - POSTGRES_DB=${POSTGRESQL_MLFLOW_DB_NAME}
    volumes:
      - ./mlflow_postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_MLFLOW_USERNAME} -d ${POSTGRESQL_MLFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build: ./mlflow
    container_name: mlflow_server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BACKEND_URI=postgresql://${POSTGRESQL_MLFLOW_USERNAME}:${POSTGRESQL_MLFLOW_PASSWORD}@db:5432/${POSTGRESQL_MLFLOW_DB_NAME}
      - MLFLOW_FLASK_SERVER_SECRET_KEY=${MLFLOW_FLASK_SERVER_SECRET_KEY}
    volumes:
      - ./mlflow_artifact_volume:/opt/mlflow/artifacts
    command: >
      mlflow server 
      --backend-store-uri postgresql://${POSTGRESQL_MLFLOW_USERNAME}:${POSTGRESQL_MLFLOW_PASSWORD}@db:5432/${POSTGRESQL_MLFLOW_DB_NAME}
      --default-artifact-root /opt/mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"